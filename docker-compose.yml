services:

  # -----------------------------------------------------------------------------
  # PostgreSQL - Persiste usuarios, reservas, historial de puntajes
  # -----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: booklibre-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: booklibre
      POSTGRES_USER: booklibre
      POSTGRES_PASSWORD: booklibre
    ports:
      - "5432:5432"
    volumes:
      - booklibre_postgres_data:/var/lib/postgresql/data
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booklibre -d booklibre"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------------------------
  # MongoDB - Config Servers (replica set: configrs)
  # -----------------------------------------------------------------------------
  configsvr1:
    image: mongo:7
    container_name: configsvr1
    environment:
      - RS_NAME=configrs
      - RS_IS_CONFIG=true
      - RS_MEMBERS=configsvr1:27017,configsvr2:27017,configsvr3:27017
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["mongod", "--configsvr", "--replSet", "configrs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25", "--keyFile", "/tmp/mongo.key"]
    volumes:
      - booklibre_mongo_configsvr1_data:/data/db
      - ./mongo-init:/scripts:ro
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  configsvr2:
    image: mongo:7
    container_name: configsvr2
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["mongod", "--configsvr", "--replSet", "configrs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25", "--keyFile", "/tmp/mongo.key"]
    volumes:
      - booklibre_mongo_configsvr2_data:/data/db
      - ./mongo-init:/scripts:ro
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  configsvr3:
    image: mongo:7
    container_name: configsvr3
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["mongod", "--configsvr", "--replSet", "configrs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25", "--keyFile", "/tmp/mongo.key"]
    volumes:
      - booklibre_mongo_configsvr3_data:/data/db
      - ./mongo-init:/scripts:ro
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -----------------------------------------------------------------------------
  # MongoDB - Shard 1 (replica set: shard1rs) - PSA Architecture
  # -----------------------------------------------------------------------------
  shard1a:
    image: mongo:7
    container_name: shard1a
    environment:
      - RS_NAME=shard1rs
      - RS_IS_CONFIG=false
      - RS_MEMBERS=shard1a:27017,shard1b:27017,shard1c:27017
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25", "--keyFile", "/tmp/mongo.key"]
    volumes:
      - booklibre_mongo_shard1a_data:/data/db
      - ./mongo-init:/scripts:ro
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shard1b:
    image: mongo:7
    container_name: shard1b
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25", "--keyFile", "/tmp/mongo.key"]
    volumes:
      - booklibre_mongo_shard1b_data:/data/db
      - ./mongo-init:/scripts:ro
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shard1c:
    image: mongo:7
    container_name: shard1c
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25", "--keyFile", "/tmp/mongo.key"]
    volumes:
      - booklibre_mongo_shard1c_data:/data/db
      - ./mongo-init:/scripts:ro
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -----------------------------------------------------------------------------
  # MongoDB - Shard 2 (replica set: shard2rs) - PSA Architecture
  # -----------------------------------------------------------------------------
  shard2a:
    image: mongo:7
    container_name: shard2a
    environment:
      - RS_NAME=shard2rs
      - RS_IS_CONFIG=false
      - RS_MEMBERS=shard2a:27017,shard2b:27017,shard2c:27017
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25", "--keyFile", "/tmp/mongo.key"]
    volumes:
      - booklibre_mongo_shard2a_data:/data/db
      - ./mongo-init:/scripts:ro
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shard2b:
    image: mongo:7
    container_name: shard2b
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25", "--keyFile", "/tmp/mongo.key"]
    volumes:
      - booklibre_mongo_shard2b_data:/data/db
      - ./mongo-init:/scripts:ro
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shard2c:
    image: mongo:7
    container_name: shard2c
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25", "--keyFile", "/tmp/mongo.key"]
    volumes:
      - booklibre_mongo_shard2c_data:/data/db
      - ./mongo-init:/scripts:ro
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -----------------------------------------------------------------------------
  # Init - Fase 1: inicializa los 3 replica sets
  # -----------------------------------------------------------------------------
  mongo-rs-init:
    image: mongo:7
    container_name: mongo-rs-init
    restart: "no"
    depends_on:
      configsvr1: { condition: service_healthy }
      configsvr2: { condition: service_healthy }
      configsvr3: { condition: service_healthy }
      shard1a:    { condition: service_healthy }
      shard1b:    { condition: service_healthy }
      shard1c:    { condition: service_healthy }
      shard2a:    { condition: service_healthy }
      shard2b:    { condition: service_healthy }
      shard2c:    { condition: service_healthy }
    volumes:
      - ./mongo-init:/scripts:ro
    command: ["bash", "/scripts/01-init-replicasets.sh"]
    networks:
      - booklibre-net

  # -----------------------------------------------------------------------------
  # Router (mongos-router)
  # -----------------------------------------------------------------------------
  mongos-router1:
    image: mongo:7
    container_name: mongos-router1
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: >
      mongos
      --configdb configrs/configsvr1:27017,configsvr2:27017,configsvr3:27017
      --bind_ip_all
      --port 27017
      --keyFile /tmp/mongo.key
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-init:/scripts:ro
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mongos-router2:
    image: mongo:7
    container_name: mongos-router2
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: >
      mongos
      --configdb configrs/configsvr1:27017,configsvr2:27017,configsvr3:27017
      --bind_ip_all
      --port 27017
      --keyFile /tmp/mongo.key
    ports:
      - "27018:27017"
    volumes:
      - ./mongo-init:/scripts:ro
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # -----------------------------------------------------------------------------
  # Init - Fase 2: agrega shards a router y habilita sharding en las colecciones
  # -----------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: mongo
    restart: "no"
    depends_on:
      mongos-router1: { condition: service_healthy }
      mongos-router2: { condition: service_healthy }
    volumes:
      - ./mongo-init:/scripts:ro
    command: ["mongosh", "--host", "mongos-router1", "--port", "27017", "-u", "admin", "-p", "booklibre_admin_secret", "--authenticationDatabase", "admin", "/scripts/02-init-cluster.js"]
    networks:
      - booklibre-net

  # -----------------------------------------------------------------------------
  # Backend Spring Boot
  # -----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booklibre-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGODB_URI=mongodb://booklibre_app:booklibre_app_secret@mongos-router1:27017,mongos-router2:27017/booklibreMongo?authSource=booklibreMongo&wtimeoutMS=5000&socketTimeoutMS=5000&connectTimeoutMS=5000
      - JAVA_OPTS=-Xmx256m -Xms128m
    ports:
      - "8080:8080"
    networks:
      - booklibre-net
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/libros/home?usuarioId=1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------------------------
  # Frontend React + Vite
  # -----------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend-2026-grupo-12
      dockerfile: Dockerfile
    container_name: booklibre-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend-2026-grupo-12:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - booklibre-net

networks:
  booklibre-net:
    driver: bridge

volumes:
  booklibre_postgres_data:
  booklibre_mongo_configsvr1_data:
  booklibre_mongo_configsvr2_data:
  booklibre_mongo_configsvr3_data:
  booklibre_mongo_shard1a_data:
  booklibre_mongo_shard1b_data:
  booklibre_mongo_shard1c_data:
  booklibre_mongo_shard2a_data:
  booklibre_mongo_shard2b_data:
  booklibre_mongo_shard2c_data:

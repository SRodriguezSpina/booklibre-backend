services:
  postgres:
    image: postgres:16-alpine
    container_name: booklibre-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: booklibre
      POSTGRES_USER: booklibre
      POSTGRES_PASSWORD: booklibre
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - booklibre-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booklibre -d booklibre" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:latest
    container_name: booklibre-mongo
    restart: unless-stopped
    ports:
      - "27017:27017" # Usamos el estándar para evitar confusiones
    environment:
      MONGO_INITDB_ROOT_USERNAME: booklibre
      MONGO_INITDB_ROOT_PASSWORD: booklibre
      MONGO_INITDB_DATABASE: booklibre
    volumes:
      - mongodata:/data/db
      # Si tenés un script inicial de libros, descomenta la siguiente línea:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.kotlin
    networks:
      - booklibre-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booklibre-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    networks:
      - booklibre-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/api/libros/home?usuarioId=1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  frontend:
    build:
      context: ../frontend-2026-grupo-12
      dockerfile: Dockerfile
    container_name: booklibre-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend-2026-grupo-12:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - booklibre-net

networks:
  booklibre-net:
    driver: bridge

volumes:
  pgdata:
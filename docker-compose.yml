services:

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL — persiste usuarios, reservas, historial de puntajes
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: booklibre-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: booklibre
      POSTGRES_USER: booklibre
      POSTGRES_PASSWORD: booklibre
    ports:
      - "5432:5432"
    volumes:
      - booklibre_postgres_data:/var/lib/postgresql/data
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booklibre -d booklibre"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2 ROUTERS
  # ─────────────────────────────────────────────────────────────────────────────
  # MongoDB — Config Servers (replica set: configrs)
  # Almacenan los metadatos del cluster (rangos de chunks, ubicación de shards)
  # ─────────────────────────────────────────────────────────────────────────────
  configsvr1:
    image: mongo:7
    container_name: configsvr1
    command: ["mongod", "--configsvr", "--replSet", "configrs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - booklibre_mongo_configsvr1_data:/data/db
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  configsvr2:
    image: mongo:7
    container_name: configsvr2
    command: ["mongod", "--configsvr", "--replSet", "configrs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - booklibre_mongo_configsvr2_data:/data/db
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  configsvr3:
    image: mongo:7
    container_name: configsvr3
    command: ["mongod", "--configsvr", "--replSet", "configrs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - booklibre_mongo_configsvr3_data:/data/db
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────────
  # MongoDB — Shard 1 (replica set: shard1rs)
  # ─────────────────────────────────────────────────────────────────────────────
  shard1a:
    image: mongo:7
    container_name: shard1a
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - booklibre_mongo_shard1a_data:/data/db
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shard1b:
    image: mongo:7
    container_name: shard1b
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - booklibre_mongo_shard1b_data:/data/db
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shard1c:
    image: mongo:7
    container_name: shard1c
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - booklibre_mongo_shard1c_data:/data/db
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────────
  # MongoDB — Shard 2 (replica set: shard2rs)
  # ─────────────────────────────────────────────────────────────────────────────
  shard2a:
    image: mongo:7
    container_name: shard2a
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - booklibre_mongo_shard2a_data:/data/db
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shard2b:
    image: mongo:7
    container_name: shard2b
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - booklibre_mongo_shard2b_data:/data/db
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shard2c:
    image: mongo:7
    container_name: shard2c
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--bind_ip_all", "--port", "27017"]
    volumes:
      - booklibre_mongo_shard2c_data:/data/db
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────────
  # Init — Fase 1: inicializa los 3 replica sets
  # Sale con exit 0 cuando termina; permite que mongos arranque.
  # ─────────────────────────────────────────────────────────────────────────────
  mongo-rs-init:
    image: mongo:7
    container_name: mongo-rs-init
    restart: "no"
    depends_on:
      configsvr1: { condition: service_healthy }
      configsvr2: { condition: service_healthy }
      configsvr3: { condition: service_healthy }
      shard1a:    { condition: service_healthy }
      shard1b:    { condition: service_healthy }
      shard1c:    { condition: service_healthy }
      shard2a:    { condition: service_healthy }
      shard2b:    { condition: service_healthy }
      shard2c:    { condition: service_healthy }
    volumes:
      - ./mongo-init:/scripts:ro
    command: ["bash", "/scripts/01-init-replicasets.sh"]
    networks:
      - booklibre-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Mongos — router del cluster sharded
  # Arranca solo después de que configrs ya está inicializado.
  # La app Spring se conecta únicamente a este nodo.
  # ─────────────────────────────────────────────────────────────────────────────
  mongos:
    image: mongo:7
    container_name: mongos
    command: >
      mongos
      --configdb configrs/configsvr1:27017,configsvr2:27017,configsvr3:27017
      --bind_ip_all
      --port 27017
    ports:
      - "27017:27017"
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    networks:
      - booklibre-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Init — Fase 2: agrega shards a mongos y habilita sharding en las colecciones
  # ─────────────────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo
    restart: "no"
    depends_on:
      mongos: { condition: service_healthy }
    volumes:
      - ./mongo-init:/scripts:ro
    command: ["mongosh", "--host", "mongos", "--port", "27017", "/scripts/02-init-cluster.js"]
    networks:
      - booklibre-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend Spring Boot
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booklibre-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGODB_URI=mongodb://mongos:27017/booklibreMongo
    ports:
      - "8080:8080"
    networks:
      - booklibre-net
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/libros/home?usuarioId=1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend React + Vite
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend-2026-grupo-12
      dockerfile: Dockerfile
    container_name: booklibre-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend-2026-grupo-12:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - booklibre-net

# AGREGAR ARBITRO

networks:
  booklibre-net:
    driver: bridge

volumes:
  booklibre_postgres_data:
  booklibre_mongo_configsvr1_data:
  booklibre_mongo_configsvr2_data:
  booklibre_mongo_configsvr3_data:
  booklibre_mongo_shard1a_data:
  booklibre_mongo_shard1b_data:
  booklibre_mongo_shard1c_data:
  booklibre_mongo_shard2a_data:
  booklibre_mongo_shard2b_data:
  booklibre_mongo_shard2c_data:

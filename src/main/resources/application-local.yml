server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booklibre
    username: booklibre
    password: booklibre
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      # Desarrollo local: conectar al mongos local (puerto 27017)
      # Para levantar solo el cluster Mongo: docker-compose up configsvr1 configsvr2 configsvr3 shard1a shard1b shard1c shard2a shard2b shard2c mongo-rs-init mongos mongo-cluster-init
      uri: mongodb://localhost:27017/booklibreMongo
      database: booklibreMongo
server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booklibre
    username: booklibre
    password: booklibre
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/booklibreMongo}
      database: booklibreMongo
    redis:
      host: localhost
      port: 6379
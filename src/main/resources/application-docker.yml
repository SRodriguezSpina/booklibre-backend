server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://db:5432/booklibre
    username: booklibre
    password: booklibre
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration

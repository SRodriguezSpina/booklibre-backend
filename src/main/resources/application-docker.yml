server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/booklibre
    username: booklibre
    password: booklibre
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: mongodb://mongos-router:27017/booklibreMongo
      database: booklibreMongo
  main:
    allow-bean-definition-overriding: true

server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://db:5432/booklibre
    username: booklibre
    password: booklibre
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      # La app se conecta al router mongos con usuario autenticado
      uri: mongodb://booklibre_app:booklibre_app_secret@mongos:27017/booklibreMongo?authSource=booklibreMongo
      database: booklibreMongo
